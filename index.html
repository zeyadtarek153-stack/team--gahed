<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فريق المبدعين | Dynamic Team Backgrounds</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #7c3aed;
      --accent: #06b6d4;
      --card-bg: rgba(15, 23, 42, 0.82);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* خلفية الصفحة الديناميكية التي تتغير لكل عضو */
    body {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      transition: background-image 0.8s ease-in-out;
    }

    /* طبقة تغشية (Overlay) داعمة لقراءة النصوص بوضوح فوق الخلفيات */
    .bg-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1;
    }

    /* حاوية العرض الرئيسية */
    .app-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 650px;
      min-height: 700px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 40px 30px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.4s ease;
    }

    .hidden { display: none !important; }

    /* شاشة القفل */
    .lock-box {
      text-align: center;
      margin: auto 0;
    }

    .lock-icon {
      font-size: 50px;
      color: var(--accent);
      margin-bottom: 20px;
      text-shadow: 0 0 20px var(--accent);
    }

    .title-main {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--text-sub);
      font-size: 15px;
      margin-bottom: 30px;
    }

    .input-group input {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      font-size: 18px;
      text-align: center;
      outline: none;
      transition: 0.3s;
      margin-bottom: 25px;
    }

    .input-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
    }

    .btn-action {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(124, 58, 237, 0.4);
      transition: transform 0.2s;
    }

    .btn-action:hover {
      transform: translateY(-2px);
    }

    /* بيانات العضو */
    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .img-wrapper {
      position: relative;
      width: 150px;
      height: 150px;
      margin-bottom: 15px;
    }

    .profile-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255,255,255,0.25);
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .role-badge {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      padding: 5px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .member-name {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .member-bio {
      color: var(--text-sub);
      font-size: 14px;
      line-height: 1.6;
      text-align: center;
      margin-bottom: 20px;
      max-width: 90%;
    }

    /* أشرطة المهارات */
    .skills-container {
      width: 100%;
      margin-bottom: 20px;
    }

    .skill-item {
      margin-bottom: 10px;
    }

    .skill-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .skill-bar {
      width: 100%;
      height: 7px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .skill-progress {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 10px;
      width: 0%;
      transition: width 1s ease-in-out;
    }

    /* مشغل الصوت */
    .audio-player-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .play-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      border: none;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
    }

    .play-btn:hover { transform: scale(1.1); }

    .audio-details { flex-grow: 1; }

    .song-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 5px;
    }

    .progress-container {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 5px;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 5px;
    }

    /* التنقل */
    .nav-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-nav {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 10px 20px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-nav:hover { background: rgba(255, 255, 255, 0.2); }

    .dots-wrapper {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transition: 0.3s;
      cursor: pointer;
    }

    .dot.active {
      background: var(--accent);
      width: 20px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- خلفية داكنة لتوضيح النصوص -->
  <div class="bg-overlay"></div>

  <!-- عنصر الصوت -->
  <audio id="audio-element"></audio>

  <!-- الحاوية الرئيسية -->
  <div class="app-container">

    <!-- شاشة كلمة السر -->
    <div id="lock-screen" class="lock-box">
      <div class="lock-icon"><i class="fas fa-shield-alt"></i></div>
      <h1 class="title-main">بوابة التيم السرية</h1>
      <p class="subtitle">أدخل كلمة المرور لاستعراض أعضاء الفريق والخلفيات</p>
      
      <div class="input-group">
        <input type="password" id="passInput" placeholder="Password...">
      </div>
      <button class="btn-action" onclick="unlock()">دخول المشروع <i class="fas fa-arrow-left"></i></button>
    </div>

    <!-- شاشة عرض الأعضاء -->
    <div id="profile-screen" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
      
      <div class="profile-header">
        <div class="img-wrapper">
          <img id="member-img" src="" alt="Member Image" class="profile-img">
        </div>
        <span id="member-role" class="role-badge">المسمى الوظيفي</span>
        <h2 id="member-name" class="member-name">اسم العضو</h2>
        <p id="member-bio" class="member-bio">وصف مختصر لمهام العضو.</p>
      </div>

      <div class="skills-container" id="skills-list"></div>

      <div class="audio-player-card">
        <button class="play-btn" id="play-btn" onclick="togglePlay()">
          <i class="fas fa-play" id="play-icon"></i>
        </button>
        <div class="audio-details">
          <div class="song-title" id="song-title">أغنية العضو</div>
          <div class="progress-container" onclick="seekAudio(event)">
            <div class="progress-fill" id="audio-progress"></div>
          </div>
        </div>
      </div>

      <div class="nav-controls">
        <button class="btn-nav" id="prev-btn" onclick="prevMember()"><i class="fas fa-chevron-right"></i> السابق</button>
        <div class="dots-wrapper" id="dots-container"></div>
        <button class="btn-nav" id="next-btn" onclick="nextMember()">التالي <i class="fas fa-chevron-left"></i></button>
      </div>

    </div>

  </div>

  <script>
    // بيانات الأعضاء مع تخصيص خلفية فريدة (bgImage) لكل شخصية
    const teamMembers = [
      {
        name: "زياد طارق",
        role: "Team Leader",
        bio: "علي الله التساهيل",
        img: "ziad.jpeg",
        bgImage: "ziad2-bg.jpg", // خلفية تقنية / تكنولوجية
        songTitle: "أغنية القائد 🎵",
        song: "ziad.mp3",
        skills: [{ name: "C++ & Architecture", percent: "90%" }, { name: "Problem Solving", percent: "85%" }]
      },
      {
        name: "زياد حاتم",
        role: "Co-Leader",
        bio: "مسؤول عن نكش في التيم .",
        img: "hatem.jpg",
        bgImage: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200&auto=format&fit=crop&q=80", // خلفية جرافيك وتصميم فنية
        songTitle: "أغنية نائب الليدر 🔥",
        song: "hatem.mp3",
        skills: [{ name: "قوة الملاحظة", percent: "95%" }, { name: "Figma & Styling", percent: "90%" }]
      },
      {
        name: "روان السيد",
        role: "دحيحة",
        bio: "في حب حما هاني",
        img: "rawan.jpeg",
        bgImage: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=1200&auto=format&fit=crop&q=80", // خلفية برمجة وويب
        songTitle: "ثيم فرونت إند ⚡",
        song: "rawan.mp3",
        skills: [{ name: "HTML & CSS", percent: "95%" }, { name: "JavaScript", percent: "88%" }]
      },
      {
        name: "رنا محمد",
        role: "دحيحة برو",
        bio: "الحذر والترقب من شبرا",
        img: "rana.jpeg",
        bgImage: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=1200&auto=format&fit=crop&q=80", // خلفية هاردوير وأكواد مااتريكس
        songTitle: "نغمة الـ Hardware 🛠️",
        song: "rana.mp3",
        skills: [{ name: "Verilog & Digital", percent: "92%" }, { name: "Circuit Design", percent: "85%" }]
      },
      {
        name: "حنين احمد",
        role: "دحيحة برو ماكس",
        bio: "لاتعلم خطوتها التاليه ولا هيا",
        img: "haneen.jpeg",
        bgImage: "https://images.unsplash.com/photo-1457369804613-52c61a468e7d?w=1200&auto=format&fit=crop&q=80", // خلفية كتب وتوثيق
        songTitle: "الأغنية التوثيقية ✨",
        song: "haneen.mp3",
        skills: [{ name: "Testing & QA", percent: "90%" }, { name: "Technical Writing", percent: "95%" }]
      }
    ];

    let currentIndex = 0;
    const audio = document.getElementById('audio-element');
    let isPlaying = false;

    function unlock() {
      const pass = document.getElementById('passInput').value;
      if (pass === 'team2026') { // كلمة السر
        document.getElementById('lock-screen').classList.add('hidden');
        document.getElementById('profile-screen').classList.remove('hidden');
        initDots();
        loadMember(currentIndex);
      } else {
        alert('كلمة السر خاطئة!');
      }
    }

    function initDots() {
      const dotsWrapper = document.getElementById('dots-container');
      dotsWrapper.innerHTML = '';
      teamMembers.forEach((_, idx) => {
        const dot = document.createElement('div');
        dot.className = `dot ${idx === currentIndex ? 'active' : ''}`;
        dot.onclick = () => { currentIndex = idx; loadMember(currentIndex); };
        dotsWrapper.appendChild(dot);
      });
    }

    function loadMember(index) {
      const member = teamMembers[index];

      // تغيير خلفية الصفحة بالكامل لكل عضو ديناميكياً
      document.body.style.backgroundImage = `url('${member.bgImage}')`;

      audio.pause();
      isPlaying = false;
      document.getElementById('play-icon').className = 'fas fa-play';
      document.getElementById('audio-progress').style.width = '0%';

      document.getElementById('member-img').src = member.img;
      document.getElementById('member-name').innerText = member.name;
      document.getElementById('member-role').innerText = member.role;
      document.getElementById('member-bio').innerText = member.bio;
      document.getElementById('song-title').innerText = member.songTitle;

      const skillsContainer = document.getElementById('skills-list');
      skillsContainer.innerHTML = '';
      member.skills.forEach(s => {
        skillsContainer.innerHTML += `
          <div class="skill-item">
            <div class="skill-info">
              <span>${s.name}</span>
              <span>${s.percent}</span>
            </div>
            <div class="skill-bar">
              <div class="skill-progress" style="width: ${s.percent}"></div>
            </div>
          </div>
        `;
      });

      audio.src = member.song;

      const dots = document.querySelectorAll('.dot');
      dots.forEach((dot, idx) => {
        dot.className = `dot ${idx === index ? 'active' : ''}`;
      });

      document.getElementById('prev-btn').style.visibility = index === 0 ? 'hidden' : 'visible';
      document.getElementById('next-btn').innerHTML = index === teamMembers.length - 1 ? 'إنهاء <i class="fas fa-check"></i>' : 'التالي <i class="fas fa-chevron-left"></i>';
    }

    function togglePlay() {
      const playIcon = document.getElementById('play-icon');
      if (isPlaying) {
        audio.pause();
        playIcon.className = 'fas fa-play';
      } else {
        audio.play().then(() => {
          playIcon.className = 'fas fa-pause';
        }).catch(err => alert("تأكد من وجود ملف الأغنية في مجلد songs/"));
      }
      isPlaying = !isPlaying;
    }

    audio.ontimeupdate = () => {
      if (audio.duration) {
        const progressPercent = (audio.currentTime / audio.duration) * 100;
        document.getElementById('audio-progress').style.width = `${progressPercent}%`;
      }
    };

    function seekAudio(e) {
      const width = e.target.clientWidth;
      const clickX = e.offsetX;
      const duration = audio.duration;
      if (duration) {
        audio.currentTime = (clickX / width) * duration;
      }
    }

    function nextMember() {
      if (currentIndex < teamMembers.length - 1) {
        currentIndex++;
        loadMember(currentIndex);
      } else {
        alert('لقد أنهيت استعراض التيم بنجاح! 🚀');
      }
    }

    function prevMember() {
      if (currentIndex > 0) {
        currentIndex--;
        loadMember(currentIndex);
      }
    }
  </script>
</body>
</html>
